# 云编译：每次推送到 main 或提交 PR 时，运行单元测试并打包 DMG
# 打包好的 DMG 可在 Actions 运行页面底部的 Artifacts 中下载（保留 30 天）
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新稳定版 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 运行单元测试
        run: swift test

      - name: 编译通用二进制并打包 DMG
        run: |
          # 开发构建的版本号：version.env 中的版本 + 提交短哈希
          source version.env
          VERSION="${VERSION}-dev.${GITHUB_SHA::7}" scripts/build-app.sh --universal --dmg

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: MacSMSForwarder-dmg
          path: dist/*.dmg
          retention-days: 30
