# 正式发布：推送 v* 标签（例如 v0.1.0）时编译通用二进制、打包 DMG 并发布到 GitHub Releases
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 选择最新稳定版 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 运行单元测试
        run: swift test

      - name: 编译并打包
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --universal --dmg

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
